[package]
name = "dns-server"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dns-server"
path = "src/bin/server.rs"

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
config = "0.15.22"
dashmap = "6.1.0"
nix = { version = "0.31.3", features = ["socket", "net", "uio"] }
rand = "0.10.1"
smallvec = "1.15.1"
socket2 = { version = "0.6.3", features = ["all"] }
tikv-jemallocator = "0.6.1"
tokio = { version = "1.44.2", features = ["rt-multi-thread", "net", "macros", "time", "sync", "fs", "signal"] }
